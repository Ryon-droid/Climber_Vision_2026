enemy_color: "red"
# enemy_color: "blue"

tradition_detect: false
#####-----神经网络参数-----#####
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
device: GPU
min_confidence: 0.8
use_traditional: false

#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----传统方法参数-----#####
threshold: 150.0
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75

#####-----aimer参数-----#####
yaw_offset: 0 # degree
pitch_offset: 0 # degree
comming_angle: 55 # degree
leaving_angle: 20 # degree
decision_speed: 8 # rad/s
high_speed_delay_time: 0.015 #0.015 # s
low_speed_delay_time: 0.015 #0.015 # s

#####-----shooter参数-----#####
first_tolerance: 2 # 近距离射击容差，degree
second_tolerance: 0.2  # 远距离射击容差，degree
judge_distance: 4 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

camera_name: "hikrobot"
exposure_ms: 2
gain: 12
vid_pid: "2bdf:0001"

# R_gimbal2imubody: [0, 1, 0,
#                   -1, 0, 0,
#                   0, 0, 1]
R_gimbal2imubody: [1, 0, 0,
                  0, 1, 0,
                  0, 0, 1]


# 重投影误差: 0.0875px
camera_matrix: [2403.9059667801021, 0, 753.77470943081403, 0, 2403.6641133076491, 541.43510747949836, 0, 0, 1]
distort_coeffs: [-0.021177439209239656, 0.14039801487205295, -0.0018584526172228148, 0.0014558675381182327, 0]


# R_camera2gimbal: [0, 0.00872654, 0.999962, -1, 0, 0, 0, -0.999962, 0.00872654]
t_camera2gimbal: [0.11, 0.05, 0.080]
R_camera2gimbal: [0, 0, 1, -1, 0, 0, 0, -1, 0]
