# t_camera2gimbal: [0.097739602733347003, -0.024411830749465516, 0.077919415180755194]



#####-----handeye标定参数-----#####
height: 0.0
grid_num: 100
grid_size: 0.01

#####-----gimbal参数-----#####
com_port: "/dev/ttyAIM"
speed_control: true
bullet_speed: 30  # m/s

#####-----planner-----#####
fire_thresh: 0.0035
# jump_thresh: 2              # deg, 帧间 yaw 跳变阈值
# fire_cooldown_frames: 3     # 跳变后抑制开火帧数


max_yaw_acc: 10
Q_yaw: [9e5, 0]
R_yaw: [3]

max_pitch_acc: 50
Q_pitch: [9e5, 0]
R_pitch: [3]

#####-----USB相机参数-----#####
image_width: 1280.0
image_height: 720.0
# usb_exposure: 120.0
usb_frame_rate: 30.0
usb_gamma: 10.0
usb_gain: 10.0

# 相机设备名映射
camera_name_map:
  # camera_back_right:
  #   yaw: -120.0
  #   fov_h: 59.84
  #   fov_v: 35.94
  # camera_back_left:
  #   yaw: 120.0
  #   fov_h: 54.2
  #   fov_v: 44.5
  camera_back:
    yaw: 180.0
    fov_h: 60.0
    fov_v: 45.0
    pitch_offset: 20.0


#####-----全向感知参数-----#####
perception_device: CPU  # 感知相机推理设备: CPU 或 GPU
default_fov_h: 60.0  # 默认水平视场角（度）
default_fov_v: 45.0  # 默认垂直视场角（度）
perception_pitch_offset: 0  # 全局默认pitch补偿，未在camera_name_map中配置时生效（degree）
omni_memory_duration_ms: 500  # 全向感知记忆延时，单位ms
mode: 1  # 决策模式