# enemy_color: "red"
enemy_color: "blue"

# 机器人类型配置（hero或其他）
robot_type: "hero"  # hero为英雄机器人，其他为普通机器人

#####-----神经网络参数（lobshot不使用，使用传统视觉检测绿灯）-----#####
